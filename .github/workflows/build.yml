
name: Build Cosmic Arsenal

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        run: unzip CosmicArsenal.zip -d buildsrc

      - name: Build mod
        run: |
          cd buildsrc/CosmicArsenal-Fabric-1.21.11
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-arsenal-jar
          path: buildsrc/CosmicArsenal-Fabric-1.21.11/build/libs/*.jar
          
